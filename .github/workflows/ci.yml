name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --group dev --group tests

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff Format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy aiointercept

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        aiohttp-version: ["3.13.3", "3.14.5"]
        include:
          - os: windows-latest
            python-version: "3.15"
            aiohttp-version: "3.14.5"
          - os: macos-latest
            python-version: "3.15"
            aiohttp-version: "3.14.5"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group tests

      - name: Pin aiohttp version
        run: uv pip install aiohttp==${{ matrix.aiohttp-version }}

      # --no-sync: a plain `uv run` re-syncs the venv to the lockfile, which
      # would silently revert the aiohttp pin above.
      - name: Tests
        run: |
          uv run --no-sync coverage run -m pytest tests/
          uv run --no-sync coverage report --fail-under=99
