name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies
        run: uv sync --group dev --group tests

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy aiointercept

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        aiohttp-version: ["3.13.3", "3.14.1"]
        include:
          - os: windows-latest
            python-version: "3.14"
            aiohttp-version: "3.14.1"
          - os: macos-latest
            python-version: "3.14"
            aiohttp-version: "3.14.1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies
        run: uv sync --group tests

      - name: Pin aiohttp version
        run: uv pip install aiohttp==${{ matrix.aiohttp-version }}

      # --no-sync: a plain `uv run` re-syncs the venv to the lockfile, which
      # would silently revert the aiohttp pin above.
      - name: Tests
        run: |
          uv run --no-sync coverage run -m pytest tests/
          uv run --no-sync coverage report --fail-under=99
