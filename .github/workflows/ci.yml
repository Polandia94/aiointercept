name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --group dev --group tests

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff Format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy aiointercept

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.16"]
        aiohttp-version: ["3.13.3", "3.14.5"]
        include:
          - os: windows-latest
            python-version: "3.15"
            aiohttp-version: "3.14.5"
          - os: macos-latest
            python-version: "3.15"
            aiohttp-version: "3.14.5"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group tests

      - name: Pin aiohttp version
        run: uv pip install aiohttp==${{ matrix.aiohttp-version }}

      # --no-sync: a plain `uv run` re-syncs the venv to the lockfile, which
      # would silently revert the aiohttp pin above.
      - name: Tests
        run: |
          uv run --no-sync coverage run -m pytest tests/
          uv run --no-sync coverage report --fail-under=99

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Build docs
        run: uv run --with-requirements docs/requirements.txt sphinx-build -W --keep-going -b html docs docs/_build/html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Build
        run: uv build

      # Install the wheel into a fresh venv and run from a directory without
      # the source tree, so the import cannot resolve to the checkout.
      - name: Smoke-test the wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.metadata as md
          import importlib.resources as res
          import aiointercept

          assert "site-packages" in aiointercept.__file__, aiointercept.__file__
          for name in ("aiointercept", "CallbackResult", "MockResponse", "AiointerceptRequest"):
              assert hasattr(aiointercept, name), name
          assert res.files("aiointercept").joinpath("py.typed").is_file()
          (ep,) = [e for e in md.entry_points(group="pytest11") if e.name == "aiointercept"]
          assert ep.value == "aiointercept.pytest_plugin", ep.value
          ep.load()
          PY
