name: aiohttp master

# Early warning against unreleased aiohttp changes. Runs weekly and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      aiohttp_ref:
        description: "aiohttp branch / tag / commit to test against"
        default: "master"
        required: false
      aiointercept_ref:
        description: "aiointercept branch / tag / commit to check out (leave blank for default branch)"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.aiointercept_ref || github.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv sync --group tests

      - name: Check out aiohttp ${{ inputs.aiohttp_ref || 'master' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: aio-libs/aiohttp
          ref: ${{ inputs.aiohttp_ref || 'master' }}
          path: aiohttp-src
          submodules: recursive

      # The git tree ships neither the Cython-generated .c files nor the
      # generated llhttp sources, so generate them the way aiohttp's own CI
      # does (npm and make are preinstalled on ubuntu runners) and build the
      # C extensions instead of falling back to AIOHTTP_NO_EXTENSIONS.
      - name: Generate llhttp and cythonize
        working-directory: aiohttp-src
        run: |
          make generate-llhttp
          make cythonize

      - name: Install aiohttp from master
        run: uv pip install --no-cache ./aiohttp-src

      # --no-sync everywhere below: a plain `uv run` re-syncs the venv to the
      # lockfile, which would silently replace the master build with the
      # locked aiohttp release.
      - name: Verify C extensions are compiled
        run: uv run --no-sync python -c "import aiohttp._http_parser, aiohttp; print('aiohttp', aiohttp.__version__, '- compiled extensions active')"

      - name: Tests
        run: uv run --no-sync pytest tests/
